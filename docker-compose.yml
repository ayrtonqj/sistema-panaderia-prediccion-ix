services:
  db:
    image: postgres:15
    container_name: postgres_tesis
    restart: always
    environment:
      POSTGRES_USER: eduardo
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: panaderia_victoria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduardo -d panaderia_victoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_tesis
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tesis.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n
    container_name: n8n_tesis
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_tesis
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://eduardo:123456@db:5432/panaderia_victoria
      - SECRET_KEY=${SECRET_KEY:-cambiar-esta-clave-secreta}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - modelo_data:/app/ml/models_trained
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sistema/estado')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend3
      dockerfile: Dockerfile
    container_name: frontend_tesis
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  n8n_data:
  modelo_data:
