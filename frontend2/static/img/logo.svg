<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="panGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="50%" style="stop-color:#c9956c"/>
      <stop offset="100%" style="stop-color:#b8845c"/>
    </linearGradient>
    <linearGradient id="textoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect x="5" y="5" width="50" height="50" rx="12" fill="url(#panGradient)" filter="url(#shadow)"/>
  
  <!-- Pan (forma estilizada) -->
  <ellipse cx="30" cy="32" rx="18" ry="14" fill="#e8c9a0"/>
  <ellipse cx="30" cy="30" rx="16" ry="12" fill="#f5deb3"/>
  <!-- Cortes del pan -->
  <path d="M20 28 Q30 22 40 28" stroke="#c9956c" stroke-width="2" fill="none"/>
  <path d="M22 32 Q30 26 38 32" stroke="#c9956c" stroke-width="2" fill="none"/>
  <path d="M24 36 Q30 30 36 36" stroke="#c9956c" stroke-width="2" fill="none"/>
  <!-- Brillo -->
  <ellipse cx="24" cy="26" rx="4" ry="3" fill="#fff5e6" opacity="0.6"/>
  
  <!-- Texto "VICTORIA" -->
  <text x="65" y="28" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#667eea" letter-spacing="2">VICTORIA</text>
  <text x="65" y="45" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="400" fill="#764ba2" letter-spacing="3">PANADERÍA</text>
</svg>
